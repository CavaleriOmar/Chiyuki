- name: Build ISO
  id: build
  uses: ublue-os/titanoboa@main
  with:
    image-ref: ghcr.io/kasull-454/chiyuki:latest

- name: Rename and Checksum ISO
  run: |
    mkdir -p output
    mv ${{ steps.build.outputs.iso-dest }} output/chiyuki-latest.iso
    (cd output && sha256sum chiyuki-latest.iso | tee chiyuki-latest.iso-CHECKSUM)

- name: Upload ISO
  uses: actions/upload-artifact@v4
  with:
    name: chiyuki-latest
    path: output/
