name: Generate ISO

on:
  workflow_dispatch: # Permette l'avvio manuale dalla scheda Actions
  push:
    branches:
      - main

# Definizione delle variabili d'ambiente usate nello snippet
env:
  IMAGE_NAME: chiyuki
  IMAGE_REPO: ghcr.io/kasull-454
  IMAGE_TAG: latest
  VERSION: 44 # Versione base Fedora/uBlue (es. 40, 41)
  VARIANT: Kinoite # Varianti disponibili: Silverblue, Kinoite, Sericea, ecc.

jobs:
  build-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      # Liberare spazio sul runner è caldamente consigliato per le ISO
      - name: Pulizia spazio su disco
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false

      - name: Build ISO
        uses: jasonn3/build-container-installer@main
        id: build
        with:
          arch: x86-64
          image_name: ${{ env.IMAGE_NAME }}
          image_repo: ${{ env.IMAGE_REPO }}
          image_tag: ${{ env.IMAGE_TAG }}
          version: ${{ env.VERSION }}
          variant: ${{ env.VARIANT }}
          iso_name: ${{ env.IMAGE_NAME }}-${{ env.IMAGE_TAG }}-${{ env.VERSION }}.iso

      - name: Upload ISO as artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.iso_name }}
          path: |
            ${{ steps.build.outputs.iso_path }}/${{ steps.build.outputs.iso_name }}
            ${{ steps.build.outputs.iso_path }}/${{ steps.build.outputs.iso_name }}-CHECKSUM
          if-no-files-found: error
          retention-days: 7 # Cambiato da 0 a 7 per conservare l'ISO per una settimana
          compression-level: 0
