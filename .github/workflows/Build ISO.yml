name: Build ISO

on:
  workflow_dispatch: # Ti permette di avviarlo a mano dalla scheda Actions

jobs:
  build-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4

      - name: Installazione BlueBuild CLI
        run: |
          curl -fL https://github.com/blue-build/cli/releases/latest/download/bluebuild-x86_64-unknown-linux-musl.tar.gz | tar -xz
          sudo mv bluebuild /usr/local/bin/

      - name: Generazione ISO
        run: |
          sudo bluebuild generate-iso \
            --secure-boot-url https://github.com/ublue-os/bazzite/raw/main/secure_boot.der \
            --enrollment-password universalblue \
            ./recipes/recipe.yml

      - name: Caricamento ISO negli Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ISO-Custom
          path: "*.iso"
          retention-days: 3
